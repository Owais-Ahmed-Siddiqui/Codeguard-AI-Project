<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary -->
    <title>CodeGuard AI — AI-Powered Code Review & Security Analysis</title>
    <meta name="title" content="CodeGuard AI — AI-Powered Code Review & Security Analysis" />
    <meta name="description" content="Ship secure code with CodeGuard. 20 free AI reviews/day. Detect bugs, security vulnerabilities, performance issues instantly. Ghost Mode for privacy." />

    <meta name="theme-color" content="#D4AF37" />

    <!-- Favicon & Logo - Change logo from ONE place: public/logo.svg or public/logo.png -->

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codeguard-ai-project.vercel.app/" />
    <meta property="og:title" content="CodeGuard AI — AI-Powered Code Review & Security Analysis" />
    <meta property="og:description" content="Ship secure code with CodeGuard. 20 free AI reviews/day. Detect bugs, security vulnerabilities, performance issues instantly. Ghost Mode for privacy." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CodeGuard AI" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://codeguard-ai-project.vercel.app/" />

    <meta property="twitter:description" content="Ship secure code with CodeGuard. 20 free AI reviews/day. Detect bugs, security vulnerabilities instantly." />
    <meta property="twitter:image" content="/og-image.png" />
